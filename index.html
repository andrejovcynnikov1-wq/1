    <!-- Подключаем Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ ВСТАВЬ СВОИ ДАННЫЕ FIREBASE СЮДА ПОСЛЕ СОЗДАНИЯ БАЗЫ ⚠️
        const firebaseConfig = {
            databaseURL: "ТУТ_ВСТАВЬ_ССЫЛКУ_НА_БАЗУ_ДАННЫХ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userIp = "127.0.0.1";

        // Получаем реальный IP игрока
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                userIp = data.ip;
                document.getElementById('player-ip').innerText = userIp;
            }).catch(() => {
                document.getElementById('player-ip').innerText = "Не определен";
            });

            if (!nick) {
                alert('Введите ник!');
                return;
            }

            const safeIpKey = userIp.replace(/\./g, '_');
            set(ref(db, 'players/' + safeIpKey), {
                nickname: nick,
                ip: userIp,
                regTime: new Date().toLocaleString()
            }).then(() => {
                alert('Успешная регистрация!');
            });
        };

        onValue(ref(db, 'players'), (snapshot) => {
            const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
            document.getElementById('total-players').innerText = count;
        });

        // Отправка сообщения в чат
        window.sendMessage = function() {
            const nick = document.getElementById('nickname').value.trim() || "Игрок";
            const text = document.getElementById('chat-input').value.trim();
            if (!text) return;

            push(ref(db, 'chats'), {
                sender: nick,
                text: text,
                time: new Date().toLocaleTimeString()
            });
            document.getElementById('chat-input').value = '';
        };

        // Отображение чата в реальном времени
        onValue(ref(db, 'chats'), (snapshot) => {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = '';
            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const msg = child.val();
                    chatBox.innerHTML += <div><b>${msg.sender}:</b> ${msg.text}</div>;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
